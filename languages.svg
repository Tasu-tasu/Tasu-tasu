<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" role="img" aria-labelledby="languages-title languages-desc">
<title id="languages-title">Language distribution</title>
<desc id="languages-desc">Language distribution. Jupyter Notebook: 35.6%, TeX: 32.2%, C++: 12.0%, Python: 8.0%, JavaScript: 3.4%, MATLAB: 1.9%, HTML: 1.5%, C: 1.4%, TypeScript: 1.0%, CSS: 0.9%, Other: 2.1%</desc>
<style>
  :root {
    --bg:      #ffffff;
    --fg:      #0b0b0b;
    --fg2:     #444444;
    --fg3:     #777777;
    --edge:    rgba(0,0,0,0.08);
    --slice-border: #ffffff;
    --ov:      rgba(0,0,0,0.18);
    --bar-track: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #0b0b0b;
      --fg:      #ffffff;
      --fg2:     #cccccc;
      --fg3:     #888888;
      --edge:    rgba(255,255,255,0.10);
      --slice-border: #0b0b0b;
      --ov:      rgba(255,255,255,0.15);
      --bar-track: #2a2a2a;
    }
  }
  svg { font-family: system-ui, sans-serif; }
  .label-main { font-size: 13px; fill: var(--fg);  }
  .label-sub  { font-size: 11px; fill: var(--fg3); }
  .label-bold { font-size: 13px; fill: var(--fg);  font-weight: 600; }
  .chart-title { font-size: 14px; fill: var(--fg); font-weight: 600; }
  .slice { cursor: pointer; }
  .slice:focus { outline: none; stroke: var(--fg); stroke-width: 2; }
</style>
