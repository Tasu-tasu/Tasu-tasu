<svg xmlns="http://www.w3.org/2000/svg" width="800" height="407" viewBox="0 0 800 407" role="img" aria-labelledby="language-analysis-title language-analysis-desc">
<title id="language-analysis-title">PROGRAMMING LANGUAGE ANALYSIS &amp; RECENT ACTIVITY</title>
<desc id="language-analysis-desc">Donut chart shows overall language usage. Bar chart shows activity in the last 90 days.</desc>
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1a1a1a;
    --fg-muted: #555555;
    --text-muted: #777777;
    --border: #222222;
    --grid: rgba(0, 0, 0, 0.05);
    --slice-border: #faf9f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --fg: #f0f0f0;
      --fg-muted: #a0a0a0;
      --text-muted: #888888;
      --border: #cccccc;
      --grid: rgba(255, 255, 255, 0.06);
      --slice-border: #0f0f11;
    }
  }
  
  svg {
    background-color: var(--bg);
  }
  
  .font-serif {
    font-family: Georgia, Cambria, "Times New Roman", Times, serif;
  }
  .font-sans {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .font-mono {
    font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
  }
  
  .main-title {
    font-size: 13px;
    font-weight: bold;
    fill: var(--fg);
    letter-spacing: 0.06em;
  }
  
  .sub-title {
    font-size: 11px;
    font-weight: bold;
    fill: var(--fg-muted);
    letter-spacing: 0.05em;
  }
  
  .label-text {
    font-size: 12px;
    fill: var(--fg);
  }
  
  .val-text {
    font-size: 11px;
    fill: var(--fg-muted);
  }
  
  .note-text {
    font-size: 9.5px;
    fill: var(--text-muted);
  }
  
  .bar {
    transform-origin: 520px 0;
  }
  
  /* Animations */
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .fade-in {
    opacity: 0;
    animation: fade-in 0.8s ease-out 0.6s forwards;
  }
  
  
@keyframes draw-slice-0 {
