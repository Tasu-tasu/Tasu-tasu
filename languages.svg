<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="language-analysis-title language-analysis-desc">
<title id="language-analysis-title">FIGURE 1. PROGRAMMING LANGUAGE ANALYSIS &amp; RECENT ACTIVITY</title>
<desc id="language-analysis-desc">Donut chart shows overall language usage. Bar chart shows activity in the last 90 days.</desc>
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1a1a1a;
    --fg-muted: #555555;
    --text-muted: #777777;
    --border: #222222;
    --grid: rgba(0, 0, 0, 0.05);
    --slice-border: #faf9f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --fg: #f0f0f0;
      --fg-muted: #a0a0a0;
      --text-muted: #888888;
      --border: #cccccc;
      --grid: rgba(255, 255, 255, 0.06);
      --slice-border: #0f0f11;
    }
  }
  
  svg {
    background-color: var(--bg);
  }
  
  .font-serif {
    font-family: Georgia, Cambria, "Times New Roman", Times, serif;
  }
  .font-sans {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .font-mono {
    font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
  }
  
  .main-title {
    font-size: 13px;
    font-weight: bold;
    fill: var(--fg);
    letter-spacing: 0.06em;
  }
  
  .sub-title {
    font-size: 11px;
    font-weight: bold;
    fill: var(--fg-muted);
    letter-spacing: 0.05em;
  }
  
  .label-text {
    font-size: 12px;
    fill: var(--fg);
  }
  
  .val-text {
    font-size: 11px;
    fill: var(--fg-muted);
  }
  
  .note-text {
    font-size: 9.5px;
    fill: var(--text-muted);
  }
  
  .bar {
    transform-origin: 520px 0;
  }
  
  /* Animations */
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .fade-in {
    opacity: 0;
    animation: fade-in 0.8s ease-out 0.6s forwards;
  }
  
  
@keyframes draw-slice-0 {
  from { stroke-dashoffset: 471.2389; }
  to { stroke-dashoffset: 177.7566; }
}
.slice-0 {
  stroke: #3f6a8a;
  stroke-dasharray: 471.2389;
  stroke-dashoffset: 471.2389;
  animation: draw-slice-0 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes draw-slice-1 {
  from { stroke-dashoffset: 471.2389; }
  to { stroke-dashoffset: 311.3496; }
}
.slice-1 {
  stroke: #a86c1e;
  stroke-dasharray: 471.2389;
  stroke-dashoffset: 471.2389;
  animation: draw-slice-1 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes draw-slice-2 {
  from { stroke-dashoffset: 471.2389; }
  to { stroke-dashoffset: 453.4803; }
}
.slice-2 {
  stroke: #1e3b70;
  stroke-dasharray: 471.2389;
  stroke-dashoffset: 471.2389;
  animation: draw-slice-2 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes draw-slice-3 {
  from { stroke-dashoffset: 471.2389; }
  to { stroke-dashoffset: 471.1302; }
}
.slice-3 {
  stroke: #718096;
  stroke-dasharray: 471.2389;
  stroke-dashoffset: 471.2389;
  animation: draw-slice-3 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
  
@keyframes grow-bar-0 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-0 {
  fill: #3f6a8a;
  animation: grow-bar-0 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes grow-bar-1 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-1 {
  fill: #a86c1e;
  animation: grow-bar-1 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes grow-bar-2 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-2 {
  fill: #1e3b70;
  animation: grow-bar-2 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes grow-bar-3 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-3 {
  fill: #718096;
  animation: grow-bar-3 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
</style>
