  to { transform: scaleX(1); }
}
.bar-2 {
  fill: #bd532b;
  animation: grow-bar-2 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes grow-bar-3 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-3 {
  fill: #b85a1c;
  animation: grow-bar-3 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes grow-bar-4 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-4 {
  fill: #2b5b84;
  animation: grow-bar-4 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes grow-bar-5 {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.bar-5 {
  fill: #718096;
  animation: grow-bar-5 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
</style>
