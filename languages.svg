  stroke-dasharray: 471.2389;
  stroke-dashoffset: 471.2389;
  animation: draw-slice-3 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes draw-slice-4 {
  from { stroke-dashoffset: 471.2389; }
  to { stroke-dashoffset: 455.0719; }
}
.slice-4 {
  stroke: #c2ab25;
  stroke-dasharray: 471.2389;
  stroke-dashoffset: 471.2389;
  animation: draw-slice-4 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes draw-slice-5 {
