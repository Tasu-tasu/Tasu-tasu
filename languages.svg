<title id="language-analysis-title">LANGUAGE DISTRIBUTION &amp; RECENT ACTIVITY</title>
<desc id="language-analysis-desc">Donut chart shows overall language usage with patterns. Bar chart shows activity in the last 60 days.</desc>
<style>
  :root {
    --fg: #1a1a1a;
    --fg-muted: #555555;
    --text-muted: #777777;
    --border: #222222;
    --grid: rgba(0, 0, 0, 0.05);
    --slice-border: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f0f0f0;
      --fg-muted: #a0a0a0;
      --text-muted: #888888;
      --border: #cccccc;
      --grid: rgba(255, 255, 255, 0.06);
      --slice-border: transparent;
    }
  }
  
  svg {
    background-color: transparent;
  }
  
  .font-serif {
    font-family: Georgia, Cambria, "Times New Roman", Times, serif;
  }
  .font-sans {
