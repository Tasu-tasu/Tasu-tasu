  }
  
  .main-title {
    font-size: 13px;
    font-weight: bold;
    fill: var(--fg);
    letter-spacing: 0.06em;
  }
  
  .sub-title {
    font-size: 11px;
    font-weight: bold;
    fill: var(--fg-muted);
    letter-spacing: 0.05em;
  }
  
  .label-text {
    font-size: 12px;
    fill: var(--fg);
  }
  
  .val-text {
    font-size: 11px;
    fill: var(--fg-muted);
  }
  
  .note-text {
    font-size: 9.5px;
    fill: var(--text-muted);
  }
  
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .fade-in {
    opacity: 0;
    animation: fade-in 0.8s ease-out 0.6s forwards;
  }
  
  
